name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint
              run: |
                  ruff check .
                  ruff format --check .

            - name: Test
              run: pytest -q

    types:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Type check
              run: mypy
