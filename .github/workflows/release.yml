name: Release

# Publishes to PyPI when a v* tag is pushed, using PyPI trusted publishing (OIDC).
# No API token is stored anywhere: PyPI verifies the workflow identity directly.
# Configured once at https://pypi.org/manage/account/publishing/ with:
#   owner = siktec-lab, repository = product-mapper-py,
#   workflow = release.yml, environment = pypi
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint
              run: |
                  ruff check .
                  ruff format --check .

            - name: Type check
              run: mypy

            - name: Test
              run: pytest -q

            - name: Verify the tag matches the package version
              # A tag that disagrees with pyproject.toml would publish a version nobody
              # can trace back to a commit, so fail loudly before anything is uploaded.
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
                  echo "tag=$TAG package=$PKG"
                  if [ "$TAG" != "$PKG" ]; then
                      echo "::error::Tag v$TAG does not match project version $PKG"
                      exit 1
                  fi

    build:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Build sdist and wheel
              run: |
                  python -m pip install --upgrade pip build twine
                  python -m build
                  python -m twine check dist/*

            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    publish-pypi:
        needs: build
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - uses: pypa/gh-action-pypi-publish@release/v1
