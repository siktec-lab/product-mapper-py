[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "productmapper"
version = "0.1.0"
description = "Official Python client for the ProductMapper API. Resolve UPC, EAN, GTIN, ASIN or free-text titles into live Amazon catalog listings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SIKTEC" }]
keywords = [
    "productmapper",
    "amazon",
    "asin",
    "upc",
    "ean",
    "gtin",
    "barcode",
    "product-data",
    "catalog",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://product-mapper.com"
Documentation = "https://product-mapper.com/docs"
Repository = "https://github.com/siktec-lab/product-mapper-py"
Issues = "https://github.com/siktec-lab/product-mapper-py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/productmapper"]

[tool.hatch.build.targets.sdist]
include = ["src/productmapper", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# README code blocks are documentation, formatted for readability, not by ruff.
exclude = ["*.md"]

[tool.mypy]
# Current mypy cannot target 3.9, so it checks against 3.10. Python 3.9 compatibility is
# enforced by ruff's target-version above, and by the 3.9 job in CI.
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/productmapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
